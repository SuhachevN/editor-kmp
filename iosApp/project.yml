name: ComixonEditor
options:
  bundleIdPrefix: com.comixon
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    ARCHS: arm64
    GENERATE_INFOPLIST_FILE: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../sample/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
    OTHER_LDFLAGS: "$(inherited) -framework ComixonEditor"
targets:
  ComixonEditorApp:
    type: application
    platform: iOS
    sources: [Sources]
    info:
      path: build/Info.plist
      properties:
        CADisableMinimumFrameDurationOnPhone: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.comixon.editor.sample
        INFOPLIST_KEY_CFBundleDisplayName: Comixon Editor
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Dictate text into a comic bubble or lettering.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Convert your voice into editor text using Apple speech recognition.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
    preBuildScripts:
      - name: Build shared Kotlin framework
        script: |
          cd "$SRCROOT/.."
          ./gradlew :sample:embedAndSignAppleFrameworkForXcode
        basedOnDependencyAnalysis: false
  ComixonEditorUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: ComixonEditorApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.comixon.editor.uitests
schemes:
  ComixonEditor:
    build:
      targets:
        ComixonEditorApp: all
    run:
      config: Debug
    test:
      config: Debug
      targets: [ComixonEditorUITests]
