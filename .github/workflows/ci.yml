name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-and-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - uses: gradle/actions/setup-gradle@v4
      - run: xvfb-run -a ./gradlew ktlintCheck :editor-core:desktopTest :editor-compose:desktopTest :editor-network:desktopTest :sample:desktopTest :androidApp:assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/reports/editor/
      - uses: actions/upload-artifact@v4
        with:
          name: android-demo
          path: androidApp/build/outputs/apk/debug/*.apk

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :editor-core:iosSimulatorArm64Test :editor-compose:iosSimulatorArm64Test :editor-network:iosSimulatorArm64Test :sample:linkDebugFrameworkIosSimulatorArm64
      - run: brew install xcodegen
      - run: xcodegen generate --spec iosApp/project.yml
      - run: xcodebuild -project iosApp/ComixonEditor.xcodeproj -scheme ComixonEditor -sdk iphonesimulator -configuration Debug -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-test-reports
          path: '**/build/reports/tests/'
