name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-and-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - uses: gradle/actions/setup-gradle@v4
      - run: xvfb-run -a ./gradlew ktlintCheck :editor-core:desktopTest :editor-compose:desktopTest :editor-network:desktopTest :sample:desktopTest :androidApp:assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/reports/editor/
      - uses: actions/upload-artifact@v4
        with:
          name: android-demo
          path: androidApp/build/outputs/apk/debug/*.apk

  android-device:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          script: ./gradlew :editor-core:connectedAndroidDeviceTest :editor-compose:connectedAndroidDeviceTest :editor-network:connectedAndroidDeviceTest :sample:connectedAndroidDeviceTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-device-test-reports
          path: |
            **/build/reports/androidTests/
            **/build/outputs/androidTest-results/

  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - shell: bash
        run: ./gradlew :editor-core:desktopTest :editor-compose:desktopTest :editor-network:desktopTest :sample:desktopTest
      - name: Package macOS installer
        if: runner.os == 'macOS'
        run: ./gradlew :sample:packageDmg
      - name: Check native speech helper
        if: runner.os == 'macOS'
        run: |
          sample/build/native-resources/macos/comixon-speech --self-test
          sample/build/compose/binaries/main/app/ComixonEditor.app/Contents/app/resources/comixon-speech --self-test
      - name: Package Windows application
        if: runner.os == 'Windows'
        run: ./gradlew :sample:createDistributable
      - name: Check Windows speech helper
        if: runner.os == 'Windows'
        shell: powershell
        run: ./sample/src/desktopMain/resources/speech/windows-dictation.ps1 -SelfTest
      - name: Launch packaged macOS application
        if: runner.os == 'macOS'
        run: |
          sample/build/compose/binaries/main/app/ComixonEditor.app/Contents/MacOS/ComixonEditor --smoke-test="$RUNNER_TEMP/editor-smoke.txt" &
          app_pid=$!
          for attempt in {1..30}; do
            if [ -f "$RUNNER_TEMP/editor-smoke.txt" ]; then wait "$app_pid"; cat "$RUNNER_TEMP/editor-smoke.txt"; exit 0; fi
            if ! kill -0 "$app_pid" 2>/dev/null; then wait "$app_pid"; exit 1; fi
            sleep 1
          done
          kill "$app_pid"
          exit 1
      - name: Launch packaged Windows application
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'editor-smoke.txt'
          $app = Start-Process -FilePath 'sample/build/compose/binaries/main/app/ComixonEditor/ComixonEditor.exe' -ArgumentList "--smoke-test=$report" -PassThru -WindowStyle Hidden
          if (-not $app.WaitForExit(30000)) { $app.Kill(); throw 'Packaged editor did not finish startup' }
          if ($app.ExitCode -ne 0 -or -not (Test-Path -LiteralPath $report)) { throw 'Packaged editor failed to start' }
          Get-Content -LiteralPath $report
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: macos-demo-${{ matrix.os }}
          path: sample/build/compose/binaries/main/dmg/*.dmg
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: windows-demo
          path: sample/build/compose/binaries/main/app/ComixonEditor/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-test-reports-${{ matrix.os }}
          path: |
            **/build/reports/tests/
            **/build/reports/editor/

  ios:
    runs-on: macos-15
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test shared Kotlin on iOS Simulator
        run: ./gradlew :editor-core:iosSimulatorArm64Test :editor-compose:iosSimulatorArm64Test :editor-network:iosSimulatorArm64Test :sample:iosSimulatorArm64Test :sample:linkDebugFrameworkIosSimulatorArm64
      - run: brew install xcodegen
      - run: xcodegen generate --spec iosApp/project.yml
      - name: Choose iPhone Pro simulator
        run: |
          simulator_id=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; devices=json.load(sys.stdin)["devices"]; print(next(d["udid"] for group in devices.values() for d in group if d["name"].startswith("iPhone") and "Pro" in d["name"]))')
          echo "IOS_SIMULATOR_ID=$simulator_id" >> "$GITHUB_ENV"
      - name: Build iOS application for testing
        run: |
          xcodebuild -project iosApp/ComixonEditor.xcodeproj -scheme ComixonEditor \
            -configuration Debug -destination "platform=iOS Simulator,id=$IOS_SIMULATOR_ID" \
            -derivedDataPath build/ios-simulator CODE_SIGNING_ALLOWED=NO build-for-testing
      - name: Check simulator display configuration
        run: |
          python3 -c 'import plistlib; p="build/ios-simulator/Build/Products/Debug-iphonesimulator/ComixonEditorApp.app/Info.plist"; assert plistlib.load(open(p, "rb")).get("CADisableMinimumFrameDurationOnPhone") is True, "ProMotion must be enabled as a Boolean in Info.plist"'
      - name: Test iOS application
        run: |
          xcodebuild -project iosApp/ComixonEditor.xcodeproj -scheme ComixonEditor \
            -configuration Debug -destination "platform=iOS Simulator,id=$IOS_SIMULATOR_ID" \
            -derivedDataPath build/ios-simulator -resultBundlePath build/ios-tests.xcresult \
            CODE_SIGNING_ALLOWED=NO test-without-building
      - name: Build unsigned iPhone application
        run: |
          xcodebuild -project iosApp/ComixonEditor.xcodeproj -scheme ComixonEditor \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios-device CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Package unsigned IPA
        run: |
          python3 -c 'import plistlib; p="build/ios-device/Build/Products/Release-iphoneos/ComixonEditorApp.app/Info.plist"; assert plistlib.load(open(p, "rb")).get("CADisableMinimumFrameDurationOnPhone") is True, "ProMotion must be enabled as a Boolean in Info.plist"'
          mkdir -p build/ios-package/Payload
          cp -R build/ios-device/Build/Products/Release-iphoneos/ComixonEditorApp.app build/ios-package/Payload/
          cd build/ios-package
          zip -qr ../comixon-editor-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned
          path: build/comixon-editor-unsigned.ipa
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-test-reports
          path: |
            **/build/reports/tests/
            build/ios-tests.xcresult/
